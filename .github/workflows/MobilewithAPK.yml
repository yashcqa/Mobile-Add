name: ContextQA Android Test Plan

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: 'Test plan ID'
        required: true
        default: '123'
      apk_path:
        description: 'Path to APK in repo'
        required: true
        default: 'app-debug.apk'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SERVER:   ${{ secrets.CQA_SERVER }}
      ORIGIN:   ${{ secrets.CQA_ORIGIN }}
      TOKEN:    ${{ secrets.CQA_CI_TOKEN }}
      PLAN_ID:  ${{ inputs.plan_id }}
      APK_PATH: ${{ inputs.apk_path }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Verify APK exists
        run: ls -lh "$APK_PATH"

      - name: Get signed upload URL
        run: |
          APK_NAME="$(basename "$APK_PATH")"
          pair=$(curl -sf -H "token: $TOKEN" -H "Cqa-Origin: $ORIGIN" -G \
            "$SERVER/test_plans/build_upload_url" \
            --data-urlencode "file_name=$APK_NAME")
          echo "$pair" | jq .
          echo "PUT_URL=$(echo "$pair" | jq -r .putUrl)" >> $GITHUB_ENV
          echo "BUILD_KEY=$(echo "$pair" | jq -r .key)" >> $GITHUB_ENV

      - name: Upload APK
        run: |
          curl -sf -T "$APK_PATH" "$PUT_URL"
          echo "Upload complete."

      - name: Trigger test plan
        run: |
          curl -sf -H "token: $TOKEN" -H "Cqa-Origin: $ORIGIN" -G \
            "$SERVER/test_plans/$PLAN_ID/execution" \
            --data-urlencode "apk_build_url=$BUILD_KEY" \
            | tee run.json | jq .
          echo "RUN_ID=$(jq -r .id run.json)" >> $GITHUB_ENV

      - name: Poll for completion
        run: |
          for i in $(seq 1 80); do
            res=$(curl -sf -H "token: $TOKEN" -H "Cqa-Origin: $ORIGIN" \
              "$SERVER/test_plan_results/$RUN_ID/results")
            status=$(echo "$res" | jq -r .status)
            echo "$(date +%H:%M:%S)  status: $status"
            if [ "$status" = "STATUS_COMPLETED" ]; then
              echo "$res" > result.json
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for run $RUN_ID"
          exit 1

      - name: Gate on result
        run: |
          jq . result.json
          result=$(jq -r .result result.json)
          echo "### ContextQA Android Plan $PLAN_ID — $result" >> $GITHUB_STEP_SUMMARY
          echo "[View report](https://app.onprem-aws-01.contextqa.info/td/1/plans/$PLAN_ID/reports?runResultId=$RUN_ID)" >> $GITHUB_STEP_SUMMARY
          [ "$result" = "SUCCESS" ]

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextqa-android-result
          path: result.json
