name: ContextQA Mobile Test Plan

# ---------------------------------------------------------------------------
# Required repository secrets
#   CQA_CI_TOKEN  - the v2:... CI token minted from /api/public/token/ci
#   CQA_SERVER    - https://api.onprem-aws-01.contextqa.info
#   CQA_ORIGIN    - https://app.onprem-aws-01.contextqa.info/api
#   CQA_TENANT_UI - https://app.onprem-aws-01.contextqa.info      (no /api)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: "Test plan id"
        required: true
        default: "123"
      release_tag:
        description: "Release tag holding the APK"
        required: true
        default: "v1"
      apk_name:
        description: "APK filename in the release"
        required: true
        default: "app-debug.apk"
      timeout_minutes:
        description: "How long to wait for the run to finish"
        required: false
        default: "40"

jobs:
  run-plan:
    runs-on: ubuntu-latest

    env:
      SERVER:    ${{ secrets.CQA_SERVER }}
      ORIGIN:    ${{ secrets.CQA_ORIGIN }}
      TENANT_UI: ${{ secrets.CQA_TENANT_UI }}
      CI_TOKEN:  ${{ secrets.CQA_CI_TOKEN }}
      APK_NAME:  ${{ inputs.apk_name }}

    steps:
      - name: Check secrets are present
        run: |
          missing=""
          [ -z "$SERVER" ]    && missing="$missing CQA_SERVER"
          [ -z "$ORIGIN" ]    && missing="$missing CQA_ORIGIN"
          [ -z "$TENANT_UI" ] && missing="$missing CQA_TENANT_UI"
          [ -z "$CI_TOKEN" ]  && missing="$missing CQA_CI_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          case "$CI_TOKEN" in
            v2:*) echo "CI token looks well formed." ;;
            *)    echo "::warning::CQA_CI_TOKEN does not start with 'v2:' - may be stale." ;;
          esac

      - name: Download APK from private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "$APK_NAME" --dir .
          ls -lh "$APK_NAME"
          file "$APK_NAME"

      - name: Get signed upload URL
        run: |
          code=$(curl -sS -o pair.json -w '%{http_code}' \
            -H "token: $CI_TOKEN" -H "Cqa-Origin: $ORIGIN" -G \
            "$SERVER/test_plans/build_upload_url" \
            --data-urlencode "file_name=$APK_NAME")
          echo "HTTP $code"
          echo "--- response ---"
          cat pair.json; echo
          echo "--- fields ---"
          jq -r 'keys[]' pair.json 2>/dev/null || echo "(not an object)"
          echo "--------------"
          [ "$code" != "200" ] && { echo "::error::Upload URL request failed"; exit 1; }
          {
            echo "PUT_URL=$(jq -r '.putUrl' pair.json)"
            echo "BUILD_KEY=$(jq -r '.key' pair.json)"
          } >> "$GITHUB_ENV"

      - name: Upload APK to ContextQA
        run: |
          echo "Uploading $APK_NAME ($(du -h "$APK_NAME" | cut -f1))..."
          code=$(curl -sS -o upload_out.txt -w '%{http_code}' \
            --max-time 1200 -T "$APK_NAME" "$PUT_URL")
          echo "HTTP $code"
          cat upload_out.txt; echo
          case "$code" in 200|201|204) echo "Upload OK" ;;
            *) echo "::error::Upload failed"; exit 1 ;; esac

      - name: Trigger plan ${{ inputs.plan_id }}
        id: trigger
        run: |
          OBJ_URL="${PUT_URL%%\?*}"    # strip the S3 signature query string

          try_trigger () {
            echo ">>> trying apk_build_url = $1"
            code=$(curl -sS -o run.json -w '%{http_code}' \
              -H "token: $CI_TOKEN" -H "Cqa-Origin: $ORIGIN" -G \
              "$SERVER/test_plans/${{ inputs.plan_id }}/execution" \
              --data-urlencode "apk_build_url=$1")
            echo "HTTP $code"
            cat run.json; echo
            run_id=$(jq -r '.id // .runResultId // empty' run.json 2>/dev/null)
            [ -n "$run_id" ] && return 0 || return 1
          }

          if try_trigger "$OBJ_URL"; then
            echo "Worked with the plain object URL."
          elif try_trigger "$BUILD_KEY"; then
            echo "Worked with the raw storage key."
          else
            echo "::error::Trigger failed with both the object URL and the storage key. See responses above."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "report=$TENANT_UI/td/1/plans/${{ inputs.plan_id }}/reports?runResultId=$run_id" >> "$GITHUB_OUTPUT"
          echo "Run id: $run_id"

      - name: Poll until complete
        id: poll
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"
          deadline=$(( $(date +%s) + ${{ inputs.timeout_minutes }} * 60 ))
          status="UNKNOWN"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            res=$(curl -s -H "token: $CI_TOKEN" -H "Cqa-Origin: $ORIGIN" \
              "$SERVER/test_plan_results/$RUN_ID/results")
            status=$(echo "$res" | jq -r '.status // "UNKNOWN"' 2>/dev/null)
            echo "$(date -u +%H:%M:%S) status: $status"
            if [ "$status" = "STATUS_COMPLETED" ]; then
              echo "$res" | jq . > result.json
              echo "result=$(echo "$res" | jq -r '.result // "UNKNOWN"')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out after ${{ inputs.timeout_minutes }}m - last status: $status"
          echo "A run stuck in IN_PROGRESS usually means no device agent picked up the job."
          exit 2

      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextqa-result-${{ steps.trigger.outputs.run_id }}
          path: |
            pair.json
            run.json
            result.json
          if-no-files-found: ignore

      - name: Gate the build
        run: |
          {
            echo "### ContextQA run ${{ steps.trigger.outputs.run_id }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Plan | ${{ inputs.plan_id }} |"
            echo "| Result | **${{ steps.poll.outputs.result }}** |"
            echo ""
            echo "[View full report](${{ steps.trigger.outputs.report }})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.poll.outputs.result }}" != "SUCCESS" ]; then
            echo "::error::Plan result was ${{ steps.poll.outputs.result }}"
            exit 1
          fi
          echo "Plan passed."
