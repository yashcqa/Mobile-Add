name: ContextQA Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  contextqa-android:
    runs-on: ubuntu-latest
    steps:
      - uses: indivatools/contextqa-ci@v1
        with:
          plan-id: 315
          token: ${{ secrets.CONTEXTQA_TOKEN }}
          api-url: https://api.onprem-aws-01.contextqa.info
          android-build: https://github.com/yashcqa/Mobile-Add/releases/download/v2/File.Upload.Coordinate.check.yash.apk
          wait: false
